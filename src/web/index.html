<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>體重管理追蹤系統</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="login-view" class="login-shell" hidden>
    <section class="login-card">
      <p class="eyebrow">診所工作流程</p>
      <h1>體重管理追蹤系統</h1>
      <p class="muted">請使用已授權的診所帳號登入。</p>
      <form id="login-form" class="stack">
        <label>使用者名稱<input name="username" autocomplete="username" required maxlength="64"></label>
        <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">登入</button>
      </form>
      <p id="login-error" class="form-error" role="alert"></p>
    </section>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <button class="brand-mark" data-action="home" aria-label="病人清單">WM</button>
        <div>
          <strong>體重管理追蹤系統</strong>
          <span>診所輔助追蹤工具 · HIS 仍為正式病歷與用藥醫囑來源</span>
        </div>
      </div>
      <div class="user-tools">
        <span id="signed-in-user" class="user-badge"></span>
        <button id="admin-nav" class="quiet" data-action="admin" hidden>管理設定</button>
        <button class="quiet" data-action="logout">登出</button>
      </div>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <main class="workspace">
      <section id="patient-list-view"></section>
      <section id="patient-view" hidden></section>
      <section id="admin-view" hidden></section>
    </main>
  </div>
</body>
</html>
